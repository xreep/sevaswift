services:
  postgres:
    image: postgres:16-alpine
    container_name: sevaswift-postgres
    environment:
      POSTGRES_DB: sevaswift
      POSTGRES_USER: sevaswift
      POSTGRES_PASSWORD: sevaswift_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevaswift -d sevaswift"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
