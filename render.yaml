# Render Blueprint: one web service (API + web app + Socket.IO on one origin) and a Postgres database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
databases:
  - name: sevaswift-db
    plan: free
    # Must match the web service region: the internal connection string only works within one region.
    region: singapore
    databaseName: sevaswift
    user: sevaswift
    # Reachable only from Render services in this workspace, not the public internet.
    ipAllowList: []

services:
  - type: web
    name: sevaswift
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /health
    buildCommand: >-
      cd frontend && npm ci --include=dev && npm run build &&
      cd ../backend && npm ci --include=dev && npx prisma generate && npm run build
    # Migrations and the idempotent demo seed run on every start.
    startCommand: cd backend && npx prisma migrate deploy && npm run prisma:seed && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: sevaswift-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_DIST
        value: ../frontend/dist
      - key: DISPATCH_RADIUS_KM
        value: '15'
      - key: OFFER_TIMEOUT_SECONDS
        value: '60'
      - key: MAX_DISPATCH_ROUNDS
        value: '3'
      - key: REPORT_TIMEZONE
        value: Asia/Kolkata
      # Optional: road travel times (openrouteservice.org) and real email delivery.
      - key: ORS_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
